name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/gym-routine-tracker-app-17khne]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken recovery or volume calculation should block the deploy.
      - run: npm run test

      - run: npm run build

      # Pages must already be enabled for the repo with Source: GitHub Actions
      # (Settings -> Pages). This cannot be done from here: creating a Pages
      # site is an admin-only API call and the workflow's GITHUB_TOKEN is
      # refused with "Resource not accessible by integration", so `enablement:
      # true` does not help.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
